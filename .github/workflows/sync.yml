name: Auto Sync Upstream

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 */8 * * *' # 每天每隔8小时自动同步

jobs:
  sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 确保有写入权限

    steps:
      # 1. 检出仓库代码（使用最新版 actions/checkout@v5 解决警告）
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. 同步上游代码（修复了参数错误和旧版本警告）
      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1 # 如果有更新版本也可以用 v3.4.2+
        with:
          target_sync_branch: main        # 注意：这里修正了之前写错的 target_branch
          upstream_sync_repo: nahtaki/pentax-feature-qr  # <-- 请修改为你的上游（原）仓库地址
          upstream_sync_branch: main      # 上游的分支（通常是 main 或 master）
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false

      # （可选）如果你需要把同步后的代码推送到你的仓库
      - name: Check for changes
        run: |
          git status
